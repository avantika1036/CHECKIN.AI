openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Visitor registration, host approvals, agent tools, and dashboard data for checkIn.ai
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: visitor-workflow
    description: Configurable visitor registration and approval workflows
  - name: agents
    description: Constrained AI agent operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /visitor/profiles:
    get:
      operationId: listVisitorProfiles
      tags: [visitor-workflow]
      summary: List the available organization profiles
      responses:
        "200":
          description: Organization profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationProfile"
  /visitor/dashboard:
    get:
      operationId: getVisitorDashboard
      tags: [visitor-workflow]
      summary: Get visitor activity and dashboard metrics
      parameters:
        - name: profileId
          in: query
          required: true
          schema:
            type: string
        - name: dateRange
          in: query
          required: false
          schema:
            type: string
            enum: [week, month]
            default: week
      responses:
        "200":
          description: Dashboard metrics and weekday/hour activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorDashboard"
  /visitor/visits:
    get:
      operationId: listVisitorVisits
      tags: [visitor-workflow]
      summary: List visits for an organization profile
      parameters:
        - name: profileId
          in: query
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/VisitStatus"
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Matching visits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VisitorVisit"
    post:
      operationId: createVisitorVisit
      tags: [visitor-workflow]
      summary: Create a visit after deterministic rule validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitorVisitInput"
      responses:
        "201":
          description: Visit awaiting host approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorVisit"
        "400":
          description: A required field is missing or a rule blocks the visit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Possible duplicate active visit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /visitor/visits/{visitId}/decision:
    post:
      operationId: decideVisitorVisit
      tags: [visitor-workflow]
      summary: Allow or deny a pending visit as its assigned host
      parameters:
        - name: visitId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostDecisionInput"
      responses:
        "200":
          description: Updated visit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorVisit"
        "403":
          description: Actor is not the visit's assigned host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Visit not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /visitor/visits/{visitId}/check-in:
    post:
      operationId: checkInVisitor
      tags: [visitor-workflow]
      summary: Check in a host-approved visitor
      parameters:
        - name: visitId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActorActionInput"
      responses:
        "200":
          description: Checked-in visit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorVisit"
        "400":
          description: Visit is not approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /visitor/visits/{visitId}/check-out:
    post:
      operationId: checkOutVisitor
      tags: [visitor-workflow]
      summary: Check out a visitor who is currently inside
      parameters:
        - name: visitId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActorActionInput"
      responses:
        "200":
          description: Checked-out visit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorVisit"
        "400":
          description: Visit is not currently checked in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /visitor/notifications:
    get:
      operationId: listVisitorNotifications
      tags: [visitor-workflow]
      summary: List in-app notifications for the current demo recipient
      parameters:
        - name: profileId
          in: query
          required: true
          schema:
            type: string
        - name: recipient
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Matching notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VisitorNotification"
  /visitor/audit:
    get:
      operationId: listVisitorAuditEvents
      tags: [visitor-workflow]
      summary: List recent audit events
      parameters:
        - name: profileId
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: Recent events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VisitorAuditEvent"
  /agents/registration-draft:
    post:
      operationId: createRegistrationDraft
      tags: [agents]
      summary: Extract a visitor registration draft from natural language
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationDraftInput"
      responses:
        "200":
          description: Extracted draft and agent trace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationDraft"
        "503":
          description: The AI provider is not configured or temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agents/analytics:
    post:
      operationId: askVisitorAnalytics
      tags: [agents]
      summary: Answer a natural-language question using approved read-only metrics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitorAnalyticsInput"
      responses:
        "200":
          description: Read-only analytics answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorAnalyticsAnswer"
        "400":
          description: Unsupported analytics question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agents/transcribe:
    post:
      operationId: transcribeVisitorAudio
      tags: [agents]
      summary: Transcribe a short audio recording with Sarvam Saaras v3
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AudioTranscriptionInput"
      responses:
        "200":
          description: Audio transcription and detected language
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioTranscription"
        "400":
          description: Audio is missing, empty, or unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Audio exceeds the upload size limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The speech-to-text provider is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    OrganizationProfile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        hostLabel:
          type: string
        requiredFields:
          type: array
          items:
            type: string
        notificationTarget:
          type: string
        rulesSummary:
          type: array
          items:
            type: string
      required: [id, name, description, hostLabel, requiredFields, notificationTarget, rulesSummary]
    VisitStatus:
      type: string
      enum: [awaiting_approval, approved, denied, checked_in, checked_out]
    AgentTraceStep:
      type: object
      properties:
        agent:
          type: string
        detail:
          type: string
        status:
          type: string
          enum: [completed, waiting, blocked]
      required: [agent, detail, status]
    VisitorVisit:
      type: object
      properties:
        id:
          type: string
        profileId:
          type: string
        visitorName:
          type: string
        affiliation:
          type: ["string", "null"]
        hostName:
          type: string
        purpose:
          type: string
        unitNumber:
          type: ["string", "null"]
        groupSize:
          type: ["integer", "null"]
        visitSlot:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/VisitStatus"
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        decisionAt:
          type: ["string", "null"]
          format: date-time
        checkInAt:
          type: ["string", "null"]
          format: date-time
        checkOutAt:
          type: ["string", "null"]
          format: date-time
        decisionNote:
          type: ["string", "null"]
      required: [id, profileId, visitorName, hostName, purpose, status, createdBy, createdAt]
    VisitorVisitInput:
      type: object
      properties:
        profileId:
          type: string
        visitorName:
          type: string
          minLength: 1
        affiliation:
          type: string
        hostName:
          type: string
          minLength: 1
        purpose:
          type: string
          minLength: 1
        unitNumber:
          type: string
        groupSize:
          type: integer
          minimum: 1
        visitSlot:
          type: string
        createdBy:
          type: string
          minLength: 1
      required: [profileId, visitorName, hostName, purpose, createdBy]
    RegistrationDraftInput:
      type: object
      properties:
        profileId:
          type: string
        utterance:
          type: string
          minLength: 3
          maxLength: 2000
      required: [profileId, utterance]
    RegistrationDraft:
      type: object
      properties:
        profileId:
          type: string
        visitorName:
          type: ["string", "null"]
        affiliation:
          type: ["string", "null"]
        hostName:
          type: ["string", "null"]
        purpose:
          type: ["string", "null"]
        unitNumber:
          type: ["string", "null"]
        groupSize:
          type: ["integer", "null"]
        visitSlot:
          type: ["string", "null"]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        missingFields:
          type: array
          items:
            type: string
        needsClarification:
          type: boolean
        agentTrace:
          type: array
          items:
            $ref: "#/components/schemas/AgentTraceStep"
      required: [profileId, confidence, missingFields, needsClarification, agentTrace]
    HostDecisionInput:
      type: object
      properties:
        action:
          type: string
          enum: [allow, deny]
        actorName:
          type: string
          minLength: 1
        note:
          type: string
      required: [action, actorName]
    ActorActionInput:
      type: object
      properties:
        actorName:
          type: string
          minLength: 1
      required: [actorName]
    VisitorNotification:
      type: object
      properties:
        id:
          type: string
        profileId:
          type: string
        visitId:
          type: string
        recipient:
          type: string
        title:
          type: string
        message:
          type: string
        status:
          type: string
          enum: [pending, approved, denied]
        createdAt:
          type: string
          format: date-time
      required: [id, profileId, visitId, recipient, title, message, status, createdAt]
    VisitorAuditEvent:
      type: object
      properties:
        id:
          type: string
        profileId:
          type: string
        visitId:
          type: ["string", "null"]
        actorName:
          type: string
        eventType:
          type: string
        message:
          type: string
        occurredAt:
          type: string
          format: date-time
      required: [id, profileId, actorName, eventType, message, occurredAt]
    ActivityCell:
      type: object
      properties:
        weekday:
          type: string
          enum: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        hour:
          type: integer
          minimum: 0
          maximum: 23
        count:
          type: integer
          minimum: 0
      required: [weekday, hour, count]
    VisitorDashboard:
      type: object
      properties:
        totalVisits:
          type: integer
        currentlyInside:
          type: integer
        pendingApprovals:
          type: integer
        deniedToday:
          type: integer
        weeklyChangePercent:
          type: number
        peakWindow:
          type: string
        activity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityCell"
        recentVisits:
          type: array
          items:
            $ref: "#/components/schemas/VisitorVisit"
      required: [totalVisits, currentlyInside, pendingApprovals, deniedToday, weeklyChangePercent, peakWindow, activity, recentVisits]
    VisitorAnalyticsInput:
      type: object
      properties:
        profileId:
          type: string
        question:
          type: string
          minLength: 3
          maxLength: 500
      required: [profileId, question]
    VisitorAnalyticsAnswer:
      type: object
      properties:
        answer:
          type: string
        metric:
          type: string
        value:
          type: integer
        agentTrace:
          type: array
          items:
            $ref: "#/components/schemas/AgentTraceStep"
      required: [answer, metric, value, agentTrace]
    AudioTranscriptionInput:
      type: object
      properties:
        file:
          type: string
          format: binary
      required: [file]
    AudioTranscription:
      type: object
      properties:
        requestId:
          type: ["string", "null"]
        transcript:
          type: string
        languageCode:
          type: ["string", "null"]
        languageProbability:
          type: ["number", "null"]
      required: [requestId, transcript, languageCode, languageProbability]

