services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: checkin
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d checkin"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/checkin
      LLM_PROVIDER: gemini
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  frontend:
    image: node:22
    working_dir: /app
    volumes:
      - "./frontend:/app"
      - "/app/node_modules"
    environment:
      API_URL: http://backend:8000
    command: sh -c "npm install && npm run dev"
    ports: ["5174:5173"]
    depends_on: [backend]

volumes:
  pgdata:
