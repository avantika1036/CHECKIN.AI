# One command starts everything:   docker compose up --build
# db        PostgreSQL (the storage)
# backend   the FastAPI server, http://localhost:8000  (API docs at /docs). Loads demo data on startup.
# frontend  the React screen,   http://localhost:5173  (the one you open in the browser)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: checkin
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d checkin"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/checkin
      AUTO_SEED: "true"
    volumes: ["./backend/app:/srv/app"]          # edit code on your laptop; the server reloads itself
    command: uvicorn app.main:app_factory --factory --host 0.0.0.0 --port 8000 --reload
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  frontend:
    image: node:22
    working_dir: /app
    volumes: ["./frontend:/app"]
    environment:
      API_URL: http://backend:8000
    command: sh -c "npm install && npm run dev"
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  pgdata:
